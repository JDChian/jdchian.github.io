<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Duen-Chian Jheng · Portfolio</title>
  <meta name="description" content="Portfolio of Duen-Chian Jheng — computer graphics, robot learning, and immersive systems." />
  <script src="assets/theme.js"></script>
  <script src="assets/data.js"></script>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <nav id="nav"></nav>

  <header class="hero container">
    <p class="hi">Hi, I'm</p>
    <h1 id="name"></h1>
    <p class="subtitle" id="title"></p>
    <p class="intro" id="intro"></p>
    <div class="links" id="hero-links"></div>
  </header>

  <section id="projects">
    <div class="container">
      <h2>Projects &amp; Research</h2>
      <div class="filters" id="filters"></div>
      <div class="grid" id="project-grid"></div>
    </div>
  </section>

  <section id="experience">
    <div class="container two-col">
      <div>
        <h2>Experience</h2>
        <div class="timeline" id="exp-list"></div>
      </div>
      <div>
        <h2>Education</h2>
        <div class="timeline" id="edu-list"></div>
      </div>
    </div>
  </section>

  <section id="skills">
    <div class="container">
      <h2>Skills</h2>
      <div id="skill-groups"></div>
    </div>
  </section>

  <section id="contact">
    <div class="container">
      <h2>Contact</h2>
      <p id="contact-text"></p>
    </div>
  </section>

  <footer><div class="container">© <span id="year"></span> Duen-Chian Jheng · Built with GitHub Pages</div></footer>

  <script>
    document.getElementById("nav").innerHTML = navHTML(true);
    document.getElementById("name").textContent = PROFILE.name;
    document.getElementById("title").textContent = PROFILE.title;
    document.getElementById("intro").textContent = PROFILE.intro;
    document.getElementById("hero-links").innerHTML =
      '<a class="btn primary" href="#projects">View Projects</a>' +
      '<a class="btn" href="' + esc(PROFILE.github) + '" target="_blank" rel="noopener">GitHub</a>' +
      '<a class="btn" href="' + esc(PROFILE.linkedin) + '" target="_blank" rel="noopener">LinkedIn</a>' +
      '<a class="btn" href="mailto:' + esc(PROFILE.email) + '">Email</a>';

    // Projects + filter
    const cats = ["All", ...new Set(PROJECTS.map(p => p.category))];
    let current = "All";
    function renderProjects() {
      document.getElementById("filters").innerHTML = cats.map(c =>
        `<button class="${c === current ? "active" : ""}" onclick="current='${esc(c)}';renderProjects()">${esc(c)}</button>`).join("");
      document.getElementById("project-grid").innerHTML = PROJECTS
        .filter(p => current === "All" || p.category === current)
        .map(p => `
          <a class="card" href="project.html?id=${encodeURIComponent(p.id)}">
            <div class="thumb">${thumbHTML(p)}</div>
            <div class="body">
              <div class="meta">${esc(p.category)} · ${esc(p.period)}</div>
              <h3>${esc(p.title)}</h3>
              <p>${esc(p.short)}</p>
              <div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
              <span class="more">Read more →</span>
            </div>
          </a>`).join("");
    }
    renderProjects();

    document.getElementById("exp-list").innerHTML = EXPERIENCE.map(e => `
      <div class="item">
        <div class="head"><strong>${esc(e.role)}</strong><span class="when">${esc(e.period)}</span></div>
        <div class="sub">${esc(e.org)} · ${esc(e.place)}</div>
        <p>${esc(e.detail)}</p>
      </div>`).join("");

    document.getElementById("edu-list").innerHTML = EDUCATION.map(e => `
      <div class="item">
        <div class="head"><strong>${esc(e.degree)}</strong><span class="when">${esc(e.period)}</span></div>
        <div class="sub">${esc(e.school)}</div>
        <p>${esc(e.detail)}</p>
      </div>`).join("");

    document.getElementById("skill-groups").innerHTML = Object.entries(SKILLS).map(([g, list]) => `
      <div class="skill-group">
        <h4>${esc(g)}</h4>
        <div class="skills">${list.map(s => `<span>${esc(s)}</span>`).join("")}</div>
      </div>`).join("");

    document.getElementById("contact-text").innerHTML =
      `Feel free to reach out at <a href="mailto:${esc(PROFILE.email)}">${esc(PROFILE.email)}</a> or connect on <a href="${esc(PROFILE.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>.`;
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
